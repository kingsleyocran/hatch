<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Domain}} — Waiting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #737373;
      margin-bottom: 2.5rem;
    }
    .domain {
      font-size: 1.5rem;
      font-weight: 500;
      color: #fafafa;
      margin-bottom: 0.5rem;
    }
    .status {
      color: #a3a3a3;
      font-size: 0.9375rem;
      margin-bottom: 0.375rem;
    }
    .port {
      color: #525252;
      font-size: 0.8125rem;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #262626;
      border-top-color: #737373;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⬡ hatch</div>
    <div class="domain">{{.Domain}}</div>
    <div class="status">Waiting for server…</div>
    <div class="port">Expected on port {{.Port}}</div>
    <div class="spinner"></div>
  </div>
  <script>
    (function() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(proto + "//" + location.host + "/__hatch/ws");
      ws.onmessage = function(e) {
        if (e.data === "ready") location.reload();
      };
      ws.onclose = function() {
        setTimeout(function() { location.reload(); }, 3000);
      };
    })();
  </script>
</body>
</html>
