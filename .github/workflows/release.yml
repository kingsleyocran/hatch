name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cli-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build CLI binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/hatch-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/hatch-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -o dist/hatch-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/hatch-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/hatch-windows-amd64.exe .

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/*

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails and dependencies
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build desktop app
        run: |
          cd desktop
          cd frontend && npm install && cd ..
          wails build

      - name: Package
        run: |
          mkdir -p dist
          cp desktop/build/bin/desktop dist/hatch-desktop-linux-amd64
          chmod +x dist/hatch-desktop-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: |
          cd desktop
          cd frontend && npm install && cd ..
          wails build

      - name: Package
        run: |
          mkdir dist
          copy desktop\build\bin\desktop.exe dist\hatch-desktop-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*

  create-release:
    needs: [cli-binaries, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp artifacts/cli-binaries/* dist/
          cp artifacts/desktop-linux/* dist/
          cp artifacts/desktop-windows/* dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
